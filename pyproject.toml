[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-recsys"
version = "0.1.0"
description = "Product recommendations and online experimentation on the H&M fashion dataset"
requires-python = ">=3.11"
# Runtime core: what the serving image needs to score precomputed candidates.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
# Everything needed to prepare data, generate candidates, train and run experiments.
train = [
    "duckdb>=1.0",
    "scipy>=1.11",
    "implicit>=0.7",
    "scikit-learn>=1.3",  # required by lightgbm's LGBMRanker
]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
# MLflow's file store is in maintenance mode, so tracking uses SQLite (needs sqlalchemy + alembic).
tracking = ["mlflow-skinny>=3.0", "sqlalchemy>=2.0", "alembic>=1.13"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",  # FastAPI's TestClient
    "hm-recsys[train,serve,tracking]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
